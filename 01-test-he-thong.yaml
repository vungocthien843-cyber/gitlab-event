specVersion: vsf-idp.io/v2
# ═══════════════════════════════════════════════════════════════════════════
# FILE 5 — LỖI DUY NHẤT: cú pháp YAML vỡ (sai thụt lề)
# Kỳ vọng: YAML_SYNTAX — parser DỪNG NGAY, không chạy validate.
# Đây là lỗi tầng 1 (fail-fast). Khác 4 file trên: 4 file kia parse được rồi
# mới báo lỗi nội dung; file này hỏng ngay từ khâu đọc YAML.
#
# Lỗi: dòng 'namespace' bị thụt lề thừa 1 space so với các key cùng cấp.
# ═══════════════════════════════════════════════════════════════════════════

metadata:
  domain: Core Banking
  system: banking-core
   namespace: loan          # <-- SAI: thụt lề lệch, YAML không parse được

spec:
  type: service
  id: loan-origination-service
  name: Loan Origination Service
  description: Xử lý hồ sơ vay - thẩm định, phê duyệt, giải ngân khoản vay.

  owners:
    members:
      - user: v.tuananh9@vinsmartfuture.tech
        role: techlead

  review:
    branch: "main"

  topology:
    - ref: system:banking/banking-core
      reason: Component này thuộc system banking-core
    - ref: providesApis:loan/loan-origination-service
      protocol: REST
      reason: Expose endpoint /loans, /loans/{id}/approve
    - ref: resource:loan/loan-postgres
      reason: Datastore lưu hồ sơ vay