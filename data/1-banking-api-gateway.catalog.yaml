specVersion: vsf-idp.io/v2
# ═══════════════════════════════════════════════════════════════════════════
# FILE CHUẨN 1/5 — Banking API Gateway
# Điểm vào duy nhất cho client bên ngoài. Định tuyến request tới các core service.
# type: gateway (có API surface). Dùng làm form mẫu cho một BFF/gateway.
# ═══════════════════════════════════════════════════════════════════════════

metadata
  domain: Platform Engineering
  system: banking-core
  namespace gateway

spec:
  type: gateway
  id: banking-api-gateway
  name: Banking API Gateway
  description: >-
    Cổng vào duy nhất cho toàn bộ client bên ngoài (mobile app, web, đối tác
    open banking). Xử lý xác thực, rate-limit tập trung và định tuyến request
    tới các service nội bộ phía sau.

  owners:
    members:
      - user: v.minhtq7@vinsmartfuture.tech
        role: techlead
      - user: v.phuongvt2@vinsmartfuture.tech
        role: maintainer

  review:
    branch: "main"

  topology:
    - ref: system:banking/banking-core
      reason: Component này thuộc system banking-core

    - ref: providesApis:gateway/banking-api-gateway
      protocol: REST
      reason: Expose API công khai cho mobile app, web và đối tác open banking

    - ref: consumesApis:account/core-account-service
      protocol: REST
      reason: Định tuyến request truy vấn số dư, thông tin tài khoản

    - ref: consumesApis:payment/payment-transfer-service
      protocol: REST
      reason: Định tuyến request chuyển tiền của khách hàng

    - ref: resource:gateway/gateway-redis-cache
      reason: Cache access token và đếm rate-limit theo từng client_id

    - ref: resource:platform/kafka
      reason: Message broker dùng chung toàn platform

    - ref: publishesTo:audit/audit.transaction-log
      protocol: Kafka
      reason: Ghi log mọi request đi qua gateway theo Thông tư 50/2024/TT-NHNN
