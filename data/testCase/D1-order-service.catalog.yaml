specVersion: vsf-idp.io/v2
# ═══════════════════════════════════════════════════════════════════════════
# FILE D1 — MẢNH 1/3 CỦA BỘ TEST MERGE (tầng 5)
# Ba file D1+D2+D3 phải MERGE CÙNG NHAU mới lộ lỗi. Từng file riêng thì HỢP LỆ.
# Chủ đích: test các lỗi chỉ nhìn thấy ở phạm vi toàn cục.
#
# Lỗi bộ D dựng ra (khi merge D1+D2+D3):
#   [T5] DEPENDENCY_CYCLE   : D1 dependsOn D2-component, D2 consumes D1-api,
#                             D1 provides D1-api  -> vòng khép kín
#   [T5] DUPLICATE_DECLARATION: D1 và D3 cùng khai báo component order-service
#   [T5] API_NO_PROVIDER    : cả hai gọi api:pricing/promo nhưng không ai provides
#   [T5] TOPIC_NO_PUBLISHER : D2 subscribe topic không ai publish
#
# FILE NÀY (D1): order-service, CỐ Ý khai dependsOn sai chiều tới payment.
# ═══════════════════════════════════════════════════════════════════════════

metadata:
  domain: Commerce
  system: commerce-core
  namespace: order

spec:
  type: service
  id: order-service
  name: Order Service (D1)
  description: Mảnh D1 - khai dependsOn sai chiều để tạo cycle khi merge.

  owners:
    members:
      - user: v.d1owner@vinsmartfuture.tech
        role: techlead

  review:
    branch: "main"

  topology:
    - ref: system:order/commerce-core
      reason: thuộc system

    - ref: providesApis:order/order-service
      protocol: REST
      reason: API của chính order-service

    # SAI CHIỀU: order khai dependsOn payment, nhưng payment mới là bên gọi order.
    # Kết hợp với D2 (payment consumes order-api) sẽ tạo vòng.
    - ref: component:payment/payment-service
      reason: dependsOn sai chiều - đây là mầm cycle

    # cả D1 và D2 cùng gọi api này nhưng không file nào provides -> API_NO_PROVIDER
    - ref: consumesApis:pricing/promo-service
      protocol: gRPC
      reason: gọi promo nhưng không ai onboard
