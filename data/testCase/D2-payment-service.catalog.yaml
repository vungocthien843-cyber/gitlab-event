specVersion: vsf-idp.io/v2
# ═══════════════════════════════════════════════════════════════════════════
# FILE D2 — MẢNH 2/3 CỦA BỘ MERGE (tầng 5)
# payment-service: consumes order-api (khép vòng với D1), subscribe 1 topic
# không ai publish.
# ═══════════════════════════════════════════════════════════════════════════

metadata:
  domain: Payment
  system: commerce-core
  namespace: payment

spec:
  type: service
  id: payment-service
  name: Payment Service (D2)
  description: Mảnh D2 - consumes order-api để khép cycle, subscribe topic mồ côi.

  owners:
    members:
      - user: v.d2owner@vinsmartfuture.tech
        role: techlead

  review:
    branch: "main"

  topology:
    - ref: system:payment/commerce-core
      reason: thuộc system

    - ref: providesApis:payment/payment-service
      protocol: REST
      reason: API của payment

    # gọi vào API của order -> cùng D1 tạo vòng:
    #   order --dependsOn--> payment(component)
    #   payment --consumes--> order(api) --provides--> order(component)
    - ref: consumesApis:order/order-service
      protocol: REST
      reason: gọi order-api, khép vòng với D1

    # subscribe topic mà KHÔNG file nào publish -> TOPIC_NO_PUBLISHER
    - ref: consumesFrom:shipping/shipping.dispatched
      protocol: Kafka
      reason: nghe topic không ai publish
