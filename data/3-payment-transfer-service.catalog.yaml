specVersion: vsf-idp.io/v2
# ═══════════════════════════════════════════════════════════════════════════
# FILE CHUẨN 3/5 — Payment Transfer Service
# Xử lý chuyển tiền. Gọi account (trừ/cộng tiền) + fraud (chấm rủi ro).
# type: service. Dùng làm form mẫu cho service orchestrate nhiều service khác.
# ═══════════════════════════════════════════════════════════════════════════

metadata:
  domain: Payment & Loyalty
  system: banking-core
  namespace: payment

spec:
  type: service
  id: payment-transfer-service
  name: Payment Transfer Service
  description: >-
    Xử lý lệnh chuyển tiền giữa tài khoản nội bộ. Gọi Core Account Service để
    trừ/cộng số dư, gọi Fraud Detection Service để kiểm tra rủi ro trước khi
    thực hiện, và phát sự kiện giao dịch cho các consumer downstream.

  owners:
    members:
      - user: v.linhpt3@vinsmartfuture.tech
        role: techlead
      - user: v.hoangnv12@vinsmartfuture.tech
        role: maintainer
      - user: v.thuyntt5@vinsmartfuture.tech
        role: member

  review:
    branch: "main"

  topology:
    - ref: system:banking/banking-core
      reason: Component này thuộc system banking-core

    - ref: providesApis:payment/payment-transfer-service
      protocol: REST
      reason: Expose endpoint /transfer, /transfer/{id}/status

    - ref: consumesApis:account/core-account-service
      protocol: REST
      reason: Trừ/cộng số dư tài khoản nguồn và đích, kiểm tra số dư khả dụng

    - ref: consumesApis:risk/fraud-detection-service
      protocol: gRPC
      reason: Chấm điểm rủi ro giao dịch trước khi cho phép chuyển tiền

    - ref: resource:payment/payment-postgres
      reason: Datastore lưu trạng thái giao dịch, idempotency key, lịch sử retry

    - ref: resource:platform/kafka
      reason: Message broker dùng chung toàn platform

    - ref: publishesTo:payment/payment.transfer-events
      protocol: Kafka
      reason: Phát sự kiện transfer_initiated, transfer_completed, transfer_failed

    - ref: publishesTo:audit/audit.transaction-log
      protocol: Kafka
      reason: Ghi log audit mọi giao dịch theo Thông tư 50/2024/TT-NHNN
