specVersion: vsf-idp.io/v2
# ═══════════════════════════════════════════════════════════════════════════
# FILE B — LỖI THIẾU TRƯỜNG & SAI KIỂU (tầng 2)
# Tách riêng khỏi file A vì các lỗi "thiếu trường" dễ bị lỗi khác che lấp.
# File này parse được, validator gom lỗi.
#
# Lỗi cố ý:
#   [T2] thiếu metadata.domain      -> REQUIRED
#   [T2] thiếu spec.id              -> REQUIRED
#   [T2] thiếu spec.name            -> REQUIRED
#   [T2] thiếu review.branch        -> REQUIRED
#   [T2] members là dict, không list-> REQUIRED / TYPE_MISMATCH
#   [T4] service thiếu providesApis  -> MISSING_PROVIDES_API (chỉ warning)
# ═══════════════════════════════════════════════════════════════════════════

metadata:
  # domain bị thiếu hoàn toàn
  system: banking-core
  namespace: payment

spec:
  type: service
  # id bị thiếu
  # name bị thiếu
  description: File thiếu nhiều trường bắt buộc.

  owners:
    # members là dict thay vì list of dict -> sai kiểu
    members:
      user: v.single@vinsmartfuture.tech
      role: techlead

  review: {}
    # branch bị thiếu trong review

  topology:
    - ref: system:payment/banking-core
      reason: thuộc system
    # type là service nhưng KHÔNG khai providesApis -> thiếu API surface
    - ref: resource:payment/payment-db
      reason: datastore râu hùm hàm én mày ngài, vai năm tấc rộng thân mười thước cao
