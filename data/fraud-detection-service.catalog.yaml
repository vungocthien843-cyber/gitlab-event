# docs/banking/fraud-detection-service/catalog-info.yaml
# Fraud Detection Service — CẤP 3: dịch vụ hỗ trợ (risk/compliance), không lộ diện với khách hàng
# ─────────────────────────────────────────────────────────────────────────────

specVersion: vsf-idp.io/v2

metadata:
  domain: Risk & Compliance
  system: banking-core
  namespace: risk

spec:
  type: service
  id: fraud-detection-service
  name: Fraud Detection Service
  description: >
    Chấm điểm rủi ro theo thời gian thực cho từng giao dịch chuyển tiền, kết
    hợp rule engine (hạn mức, tần suất bất thường) và mô hình ML phát hiện
    pattern gian lận. Được Payment Transfer Service gọi vào trước khi cho
    phép thực hiện giao dịch.

  owners:
    members:
      - user: v.tungdv9@vinsmartfuture.tech
        role: techlead
      - user: v.giangnh6@vinsmartfuture.tech
        role: member

  review:
    branch: "main"

  topology:
    # ── Membership ───────────────────────────────────────────────────────────
    - ref: system:banking/banking-core
      reason: Component này thuộc system banking-core

    # ── APIs ──────────────────────────────────────────────────────────────────
    - ref: providesApis:risk/fraud-detection-service
      protocol: gRPC
      reason: Expose endpoint chấm điểm rủi ro cho Payment Transfer Service gọi vào theo thời gian thực

    # ── Infrastructure ────────────────────────────────────────────────────────
    - ref: resource:risk/fraud-model-store
      reason: >
        Lưu mô hình ML đã train và feature store (lịch sử giao dịch, hành vi
        khách hàng) dùng để tính điểm rủi ro

    - ref: resource:platform/kafka
      reason: Message broker dùng chung toàn platform

    # ── Kafka topics ──────────────────────────────────────────────────────────
    - ref: consumesFrom:payment/payment.transfer-events
      protocol: kafka
      reason: Lắng nghe sự kiện giao dịch đã hoàn tất để cập nhật lại mô hình/feature store theo thời gian thực

    - ref: publishesTo:risk/risk.alerts
      protocol: kafka
      reason: Publish cảnh báo khi phát hiện giao dịch có điểm rủi ro vượt ngưỡng, cho đội vận hành xử lý thủ công

    - ref: publishesTo:audit/audit.transaction-log
      protocol: kafka
      reason: Ghi log mọi lần chấm điểm rủi ro (bắt buộc theo Thông tư 50/2024/TT-NHNN, Điều 18)
