specVersion: vsf-idp.io/v2

metadata:
  domain: Core Banking
  system: banking-core
  namespace: card

spec:
  type: service
  id: card-management-service
  name: Card Management Service
  description: >
    Quan ly vong doi the ngan hang - phat hanh, khoa, mo khoa, doi PIN.
    Tich hop voi doi tac in the va mang thanh toan quoc te.

  owners:
    members:
      - user: v.tungns3@corp.tech
        role: techlead
      - user: v.ngocph7@corp.tech
        role: maintainer

  review:
    branch: "develop"

  topology:
    - ref: system:banking/banking-core
      reason: Component thuoc system banking-core

    - ref: providesApis:card/card-management-service
      protocol: REST
      reason: Expose endpoint /cards, /cards/{id}/block, /cards/{id}/pin

    - ref: consumesApis:account/core-account-service
      protocol: REST
      reason: Kiem tra tai khoan lien ket truoc khi phat hanh the

    - ref: consumesApis:iam/iam-api
      protocol: REST
      reason: Xac thuc va kiem tra quyen thao tac the

    - ref: resource:card/card-postgres
      reason: Luu thong tin the, trang thai va lich su thao tac

    - ref: resource:platform/kafka
      reason: Message broker dung chung

    - ref: resource:card/card-hsm
      reason: Hardware Security Module luu tru khoa ma hoa PIN

    - ref: publishesTo:audit/audit.transaction-log
      protocol: kafka
      reason: Ghi log audit moi thao tac the theo quy dinh NHNN

    - ref: publishesTo:notify/notify.email-request
      protocol: kafka
      reason: Gui thong bao khoa/mo the cho khach hang

    - ref: consumesFrom:card/card.issuer-callback
      protocol: kafka
      reason: Nhan ket qua phat hanh the tu doi tac in the
