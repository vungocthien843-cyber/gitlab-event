specVersion: vsf-idp.io/v2
# ═══════════════════════════════════════════════════════════════════════════
# FILE CHUẨN 6/6 — EOD Settlement Batch
# Cron job đối soát cuối ngày, tổng hợp giao dịch để quyết toán với đối tác.
# type: batch (KHÔNG có API surface, chạy theo lịch, khác hẳn worker ở chỗ
# worker chạy liên tục nghe event, còn batch chạy một lần theo cron rồi kết thúc).
# Form mẫu cho một scheduled job: chỉ đọc resource + consume event, không publish.
# ═══════════════════════════════════════════════════════════════════════════

metadata:
  domain: Core Banking
  system: banking-core
  namespace: settlement

spec:
  type: batch
  id: eod-settlement-batch
  name: EOD Settlement Batch
  description: >-
    Cron job chạy cuối mỗi ngày làm việc, tổng hợp toàn bộ giao dịch chuyển
    tiền trong ngày để đối soát và tạo file quyết toán gửi đối tác thanh toán
    liên ngân hàng.

  owners:
    members:
      - user: v.baonp6@vinsmartfuture.tech
        role: techlead
      - user: v.giangth11@vinsmartfuture.tech
        role: maintainer

  review:
    branch: "main"

  topology:
    - ref: system:banking/banking-core
      reason: Component này thuộc system banking-core

    - ref: resource:settlement/settlement-postgres
      reason: Lưu file quyết toán và lịch sử chạy batch từng ngày

    - ref: resource:platform/kafka
      reason: Message broker dùng chung toàn platform

    - ref: consumesFrom:payment/payment.transfer-events
      protocol: Kafka
      reason: Tổng hợp toàn bộ sự kiện giao dịch trong ngày để đối soát
