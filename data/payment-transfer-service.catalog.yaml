# docs/banking/payment-transfer-service/catalog-info.yaml
# Payment Transfer Service — xử lý lệnh chuyển tiền giữa các tài khoản nội bộ
# Quy mô mục tiêu: 1 triệu người dùng, ~50 giao dịch/giây giờ cao điểm
# ─────────────────────────────────────────────────────────────────────────────

specVersion: vsf-idp.io/v2

metadata:
domain: Payment & Loyalty
system: banking-core
namespace: payment

spec:
type: service
id: payment-transfer-service
name: Payment Transfer Service
description: >
Xử lý lệnh chuyển tiền giữa tài khoản nội bộ, gọi Core Account Service
để trừ/cộng số dư, gọi Fraud Detection Service để kiểm tra rủi ro trước
khi thực hiện, publish sự kiện giao dịch cho audit và notification.

owners:
members:
- user: v.linhpt3@vinsmartfuture.tech
  role: techlead
- user: v.hoangnv12@vinsmartfuture.tech
  role: maintainer
- user: v.thuyntt5@vinsmartfuture.tech
  role: member
review:
branch: "main"

topology:
# ── Membership ───────────────────────────────────────────────────────────
- ref: system:banking/banking-core
  reason: Component này thuộc system banking-core (nhóm dịch vụ lõi ngân hàng)

# ── APIs ──────────────────────────────────────────────────────────────────
- ref: providesApis:payment/payment-transfer-service
  protocol: REST
  reason: OpenAPI spec của chính service này, expose endpoint /transfer, /transfer/{id}/status

- ref: consumesApis:account/core-account-service
  protocol: REST
  reason: Trừ/cộng số dư tài khoản nguồn và đích, kiểm tra số dư khả dụng

- ref: consumesApis:risk/fraud-detection-service
  protocol: gRPC
  reason: Chấm điểm rủi ro giao dịch trước khi cho phép thực hiện chuyển tiền

- ref: consumesApis:identity/kyc-service
  protocol: REST
  reason: Xác thực định danh khách hàng cho giao dịch vượt hạn mức quy định

# ── Infrastructure ────────────────────────────────────────────────────────
# LƯU Ý: chỉ khai báo 1 Postgres instance duy nhất, không có replica —
# đây là điểm cố ý để agent review kiểm tra khả năng SPOF ở tầng dữ liệu.
- ref: resource:payment/payment-postgres-primary
  reason: >
  Datastore lưu trạng thái giao dịch (pending/completed/failed),
idempotency key, lịch sử retry. Hiện tại chỉ có 1 instance, chưa
có read replica hay standby.

- ref: resource:platform/kafka
  reason: Message broker dùng chung toàn platform cho các topic publish/consume bên dưới

# ── Kafka topics ──────────────────────────────────────────────────────────
- ref: publishesTo:payment/payment.transfer-events
  protocol: kafka
  reason: Publish sự kiện transfer_initiated, transfer_completed, transfer_failed

- ref: publishesTo:audit/audit.transaction-log
  protocol: kafka
  reason: Ghi log audit cho mọi giao dịch (bắt buộc theo Thông tư 50/2024/TT-NHNN, Điều 18)

- ref: consumesFrom:notification/notification.delivery-status
protocol: kafka
reason: Nhận trạng thái gửi SMS/push notification để cập nhật lại UI cho khách hàng
