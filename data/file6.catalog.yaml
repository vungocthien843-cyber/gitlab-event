specVersion: vsf-idp.io/v2

metadata:
  domain: Risk and Compliance
  system: audit
  namespace: audit

spec:
  type: data-pipeline
  id: audit-aggregator
  name: Audit Aggregator Pipeline
  description: >
    Pipeline tong hop audit log tu nhieu service, lam giau du lieu
    va day vao data warehouse de phuc vu bao cao tuan thu.

  owners:
    members:
      - user: v.quangvm5@corp.tech
        role: techlead
      - user: v.hiennt8@corp.tech
        role: maintainer
      - user: v.phuonglt2@corp.tech
        role: member

  review:
    branch: "main"

  topology:
    - ref: system:audit/audit
      reason: Pipeline thuoc system audit

    - ref: consumesFrom:audit/audit.transaction-log
      protocol: kafka
      reason: Nhan audit log giao dich tu payment service

    - ref: consumesFrom:account/account.balance-changed
      protocol: kafka
      reason: Nhan su kien bien dong so du

    - ref: consumesFrom:iam/iam.permission-sync
      protocol: kafka
      reason: Nhan su kien thay doi quyen truy cap

    - ref: publishesTo:audit/audit.enriched-events
      protocol: kafka
      reason: Phat su kien da lam giau cho data warehouse consumer

    - ref: resource:audit/audit-clickhouse
      reason: Data warehouse luu tru audit log dai han

    - ref: resource:platform/kafka
      reason: Message broker dung chung

    - ref: component:audit/audit-schema-registry
      reason: Dung schema registry de validate event format
