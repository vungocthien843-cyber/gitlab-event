specVersion vsf-idp.io/v2

metadata
  domain: Core Banking
  system: banking-core
  namespace: account

spec:
  type: service
  id: core-account-service
  name: Core Account Service
  description: >
    Quan ly vong doi tai khoan, so du va so cai noi bo cua ngan hang.

  owners:
    members:
      - user: v.anhpq8@corp.tech
        role: techlead
      - user: v.duchm4@corp.tech
        role: maintainer
      - user: v.linhnt3@corp.tech
        role: member

  review:
    branch: "main"

  topology:
    - ref: system:banking/banking-core
      reason: Component thuoc system banking-core

    - ref: providesApis:account/core-account-service
      protocol: REST
      reason: Expose endpoint /accounts, /accounts/{id}/balance

    - ref: consumesApis:iam/iam-api
      protocol: REST
      reason: Xac thuc va phan quyen nguoi dung

    - ref: resource:account/account-postgres
      reason: Datastore chinh luu so du va so cai

    - ref: resource:platform/kafka
      reason: Message broker dung chung toan platform

    - ref: publishesTo:account/account.balance-changed
      protocol: kafka
      reason: Phat su kien khi so du tai khoan thay doi

    - ref: consumesFrom:kyc/kyc.verification-completed
      protocol: kafka
      reason: Nhan ket qua xac minh KYC de kich hoat tai khoan

    - ref: component:account/account-migrator
      reason: Tool migrate data tu legacy core banking
