specVersion: vsf-idp.io/v2

metadata:
  domain: Payment and Loyalty
  system: banking-core
  namespace: payment

spec:
  type: service
  id: payment-transfer-service
  name: Payment Transfer Service
  description: >
    Xu ly lenh chuyen tien giua cac tai khoan noi bo ngan hang.
    Ho tro chuyen tien nhanh 24/7 va lien ngan hang qua NAPAS.

  owners:
    members:
      - user: v.hoangnv12@corp.tech
        role: techlead
      - user: v.thuyntt5@corp.tech
        role: maintainer
      - user: v.minhpt9@corp.tech
        role: member

  review:
    branch: "main"

  topology:
    - ref: system:banking/banking-core
      reason: Component thuoc system banking-core

    - ref: providesApis:payment/payment-transfer-service
      protocol: REST
      reason: Expose endpoint /transfer, /transfer/{id}/status

    - ref: consumesApis:account/core-account-service
      protocol: REST
      reason: Tru/cong so du tai khoan nguon va dich

    - ref: consumesApis:iam/iam-api
      protocol: REST
      reason: Xac thuc nguoi thuc hien giao dich

    - ref: resource:payment/payment-postgres
      reason: Datastore luu trang thai giao dich

    - ref: resource:platform/kafka
      reason: Message broker dung chung toan platform

    - ref: publishesTo:audit/audit.transaction-log
      protocol: kafka
      reason: Ghi log audit moi giao dich theo Thong tu 50/2024/TT-NHNN

    - ref: publishesTo:notify/notify.email-request
      protocol: kafka
      reason: Gui yeu cau thong bao giao dich cho khach hang

    - ref: consumesFrom:payment/payment.napas-callback
      protocol: kafka
      reason: Nhan ket qua chuyen tien lien ngan hang tu NAPAS adapter
