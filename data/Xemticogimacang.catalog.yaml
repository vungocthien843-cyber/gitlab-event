# docs/banking/notification-service/catalog-info.yaml
# Notification Service — CẤP 4: worker nền (background/async), không có API surface
# ─────────────────────────────────────────────────────────────────────────────

specVersion: vsf-idp.io/v2

metadata:
  domain: Customer Experience
  system: banking-core
  namespace: notification

spec:
  type: worker
  id: notification-service
  name: Notification Service
  description: >
    Worker nền tiêu thụ sự kiện giao dịch/thay đổi số dư từ Kafka, gửi
    SMS/push notification cho khách hàng, và publish lại trạng thái gửi để
    các service khác cập nhật UI. Không expose API cho bên ngoài gọi vào.

  owners:
    members:
      - user: v.trangdt4@vinsmartfuture.tech
        role: techlead
      - user: v.longpv1@vinsmartfuture.tech
        role: member

  review:
    branch: "main"

  topology:
    # ── Membership ───────────────────────────────────────────────────────────
    - ref: system:banking/banking-core
      reason: Component này thuộc system banking-core

    # ── APIs (chỉ gọi ra ngoài, không expose API cho ai) ───────────────────────
    - ref: consumesApis:vendor/sms-gateway-provider
      protocol: REST
      reason: Gọi nhà cung cấp SMS/push notification bên thứ 3 để gửi tin nhắn thật cho khách hàng. Đầu lòng

    # ── Infrastructure ────────────────────────────────────────────────────────
    - ref: resource:notification/notification-postgres
      reason: Lưu lịch sử gửi, trạng thái thành công/thất bại, dùng để retry khi gửi lỗi

    - ref: resource:platform/kafka
      reason: Message broker dùng chung toàn platform

    # ── Kafka topics ──────────────────────────────────────────────────────────
    - ref: consumesFrom:payment/payment.transfer-events
      protocol: kafka
      reason: Nhận sự kiện giao dịch để gửi thông báo "chuyển tiền thành công/thất bại" cho khách hàng

    - ref: consumesFrom:account/account.balance-changed
      protocol: kafka
      reason: Nhận sự kiện thay đổi số dư để gửi thông báo biến động số dư

    - ref: publishesTo:notification/notification.delivery-status
      protocol: kafka
      reason: Publish trạng thái gửi để Payment Transfer Service cập nhật lại UI cho khách hàng
#Đầu lòng hai ả tố nga, thúy keief là chị em là thúy vân