specVersion: vsf-idp.io/v2

metadata:
  domain: Platform Engineering
  system: banking-core
  namespace: gateway

spec:
  type: gateway
  id: banking-api-gateway
  name: Banking API Gateway
  description: >
    Cong vao duy nhat cho toan bo client ben ngoai. Xu ly xac thuc,
    rate-limit tap trung, dinh tuyen request toi cac service noi bo.

  owners:
    members:
      - user: v.longnt7@corp.tech
        role: techlead
      - user: v.huongdt3@corp.tech
        role: maintainer

  review:
    branch: "main"

  topology:
    - ref: system:banking/banking-core
      reason: Gateway la thanh phan edge cua system banking-core

    - ref: providesApis:gateway/banking-api-gateway
      protocol: REST
      reason: Unified API endpoint cho mobile app va web

    - ref: consumesApis:account/core-account-service
      protocol: REST
      reason: Proxy request quan ly tai khoan

    - ref: consumesApis:payment/payment-transfer-service
      protocol: REST
      reason: Proxy request chuyen tien

    - ref: consumesApis:card/card-management-service
      protocol: REST
      reason: Proxy request quan ly the

    - ref: consumesApis:iam/iam-api
      protocol: REST
      reason: Xac thuc token va lay thong tin session

    - ref: resource:platform/redis
      reason: Cache session va rate-limit counter
