specVersion: vsf-idp.io/v2

metadata:
  domain: Notification
  system: notification
  namespace: notify

spec:
  type: worker
  id: email-worker
  name: Email Worker
  description: >
    Worker xu ly bat dong bo viec gui email thong bao giao dich,
    OTP va canh bao bao mat cho khach hang.

  owners:
    members:
      - user: v.trangdt4@corp.tech
        role: techlead
      - user: v.namph2@corp.tech
        role: member

  review:
    branch: "main"

  topology:
    - ref: system:notify/notification
      reason: Worker thuoc system notification

    - ref: consumesFrom:notify/notify.email-request
      protocol: kafka
      reason: Nhan yeu cau gui email tu cac service khac

    - ref: consumesFrom:account/account.balance-changed
      protocol: kafka
      reason: Gui thong bao bien dong so du cho khach hang

    - ref: publishesTo:notify/notify.email-sent
      protocol: kafka
      reason: Phat su kien khi email da gui thanh cong de audit

    - ref: resource:notify/notify-postgres
      reason: Luu lich su gui email va trang thai delivery

    - ref: resource:platform/kafka
      reason: Message broker dung chung

    - ref: component:notify/template-engine
      reason: Render email template tu Handlebars
