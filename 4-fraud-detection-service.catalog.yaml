specVersion: vsf-idp.io/v2
# ═══════════════════════════════════════════════════════════════════════════
# FILE CHUẨN 4/5 — Fraud Detection Service
# Chấm điểm rủi ro giao dịch. Được payment gọi, nghe event giao dịch.
# type: service, protocol gRPC. Form mẫu cho service expose API gRPC được gọi
# đồng bộ (không nghe event, tránh phụ thuộc vòng với payment).
# ═══════════════════════════════════════════════════════════════════════════

metadata
  domain: Risk & Fraud
  system: banking-core
  namespace: risk

spec
  type: service
  id: fraud-detection-service
  name: Fraud Detection Service
  description: >-
    Chấm điểm rủi ro và phát hiện gian lận cho mỗi giao dịch. Cung cấp API
    gRPC để Payment gọi đồng bộ trước khi cho phép chuyển tiền.

  owners:
    members:
      - user: v.tuananh9@vinsmartfuture.tech
        role: techlead
      - user: v.ngocld5@vinsmartfuture.tech
        role: maintainer

  review:
    branch: "main"

  topology:
    - ref: system:banking/banking-core
      reason: Component này thuộc system banking-core

    - ref: providesApis:risk/fraud-detection-service
      protocol: gRPC
      reason: Expose gRPC endpoint chấm điểm rủi ro giao dịch realtime

    - ref: resource:risk/risk-postgres
      reason: Datastore lưu quy tắc rủi ro và lịch sử chấm điểm

    - ref: resource:platform/kafka
      reason: Message broker dùng chung toàn platform
